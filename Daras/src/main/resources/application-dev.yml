spring:
  application:
    name: Daras

  datasource:
    url: jdbc:postgresql://localhost:5432/Dara
    username: postgres
    password: ${DB_PASSWORD:postgres_pw}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
