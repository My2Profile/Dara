spring:
  application:
    name: Daras

  datasource:
    url: jdbc:postgresql://localhost:5432/Dara
    username: postgres
    password: ${DB_PASSWORD:postgres_pw}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

  data:
    web:
      pageable:
        max-page-size: 100


  open-in-view: false

app:
  seed-admin:
    enabled: true
