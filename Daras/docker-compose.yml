services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: Dara
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pw

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 5
    
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: